version: '3.8'

services:
  nodejs-express:
    build: ./services/nodejs-express
    container_name: benchmark-express
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
    restart: unless-stopped

  nodejs-fastify:
    build: ./services/nodejs-fastify
    container_name: benchmark-fastify
    ports:
